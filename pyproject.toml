[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "oci-acme-publisher"
version = "2.0.0"
description = "ACME HTTP-01 certificate publisher and reconciler for OCI Certificates"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "OCI ACME Publisher contributors" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "acme==5.7.0",
  "aiohttp==3.14.3",
  "cryptography==49.0.0",
  "oci==2.184.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "PyYAML==6.0.2",
  "idna==3.15",
  "josepy==2.2.0",
  "pyOpenSSL==26.4.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]==7.10.5",
  "cyclonedx-bom==7.3.1",
  "lxml==6.1.1",
  "mypy==1.17.1",
  "pip-audit==2.10.1",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "ruff==0.12.9",
  "types-PyYAML==6.0.12.20250822",
]

[project.scripts]
oci-acme = "oci_acme_publisher.cli:main"
oci-acme-publisher = "oci_acme_publisher.cli:main"
oci-acme-http01 = "oci_acme_publisher.http01_responder:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oci_acme_publisher"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["oci_acme_publisher"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["oci.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
