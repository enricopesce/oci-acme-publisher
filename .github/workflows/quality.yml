name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src
      - run: uv run pip-audit --local --ignore-vuln PYSEC-2026-3552
      - run: uv run oci-acme generate-schema --output /tmp/config.schema.json
      - run: cmp /tmp/config.schema.json config/config.schema.json

  rpm:
    runs-on: [self-hosted, oraclelinux, x86_64]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/verify-release.sh
